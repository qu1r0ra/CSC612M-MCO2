# Hosted runners have MSVC but no CUDA toolkit or GPU: native lint skips the
# .cu files and the tests run the CPU path. CUDA builds and tests stay local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
      - run: just format-check
      - run: just lint

  test-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
      - run: just test-cpu

  test-cpu-asan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just test-cpu-asan

  vec-report:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
      - run: just vec-report
